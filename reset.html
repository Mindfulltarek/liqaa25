<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إعادة تعيين كلمة المرور — لقاء</title>
<meta name="description" content="عيّن كلمة مرور جديدة لحسابك في لقاء.">
<link rel="icon" href="liqaa-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/liqaa-ui.css">
<script>(function(){try{var t=localStorage.getItem('lm-theme');if(t&&t.indexOf('light')>-1)document.documentElement.classList.add('light');var l=localStorage.getItem('lm-lang');var en=l&&l.indexOf('en')>-1;document.documentElement.lang=en?'en':'ar';document.documentElement.dir=en?'ltr':'rtl';}catch(e){}})();</script>
<style>
  .pw-meter { display: flex; gap: 5px; margin-top: 2px; }
  .pw-meter i { height: 4px; flex: 1; border-radius: 999px; background: var(--border-strong); transition: background var(--t-mid) var(--ease); }
  .pw-meter.s1 i:nth-child(1) { background: #F87171; }
  .pw-meter.s2 i:nth-child(-n+2) { background: #FBBF24; }
  .pw-meter.s3 i:nth-child(-n+3) { background: #FBBF24; }
  .pw-meter.s4 i { background: var(--ok); }
  .pw-rules { display: grid; gap: 5px; margin-top: 6px; }
  .pw-rule { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--faint); }
  .pw-rule svg { width: 14px; height: 14px; flex: none; }
  .pw-rule.ok { color: var(--ok); }
</style>
</head>
<body>
<main class="auth-wrap" id="main">
  <div class="auth-top">
    <a class="brand" href="index.html"><span class="brand-mark" id="brandMark"></span><span data-i18n="brand">لقاء</span></a>
    <div class="row">
      <button class="lang-btn" id="langToggle" type="button">EN</button>
      <button class="switch" id="themeToggle" type="button" data-i18n-title="themeTitle" title="تبديل المظهر">
        <span class="knob">
          <svg class="ic ic-moon" viewBox="0 0 24 24" fill="#fff"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="ic ic-sun" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </span>
      </button>
    </div>
  </div>

  <!-- reset form -->
  <section class="auth-card anim-in" id="resetMain">
    <div class="auth-head">
      <h1 data-i18n="title">كلمة مرور جديدة</h1>
      <p data-i18n="sub">أدخل الكود المرسل إلى بريدك ثم اختر كلمة مرور جديدة</p>
    </div>

    <form id="resetForm" class="stack g3" novalidate>
      <div class="field">
        <label class="label" for="email" data-i18n="emailLabel">البريد الإلكتروني</label>
        <input class="input" type="email" id="email" autocomplete="email"
               data-i18n-ph="emailPh" placeholder="example@mail.com">
        <p class="err-msg" id="emailErr"></p>
      </div>

      <div class="field">
        <span class="label" data-i18n="codeLabel">كود إعادة التعيين</span>
        <div class="otp" id="otpBox" dir="ltr">
          <input type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="1">
          <input type="text" inputmode="numeric" maxlength="1" aria-label="2">
          <input type="text" inputmode="numeric" maxlength="1" aria-label="3">
          <input type="text" inputmode="numeric" maxlength="1" aria-label="4">
          <input type="text" inputmode="numeric" maxlength="1" aria-label="5">
          <input type="text" inputmode="numeric" maxlength="1" aria-label="6">
        </div>
        <p class="err-msg" id="codeErr"></p>
      </div>

      <div class="field">
        <label class="label" for="password" data-i18n="passLabel">كلمة المرور الجديدة</label>
        <div class="input-group">
          <input class="input" type="password" id="password" autocomplete="new-password"
                 data-i18n-ph="passPh" placeholder="••••••••">
          <button class="in-btn" type="button" data-eye="password" aria-label="إظهار كلمة المرور"></button>
        </div>
        <div class="pw-meter" id="pwMeter" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <div class="pw-rules">
          <span class="pw-rule" data-rule="len"><span class="ri"></span><span data-i18n="ruleLen">٨ أحرف على الأقل</span></span>
          <span class="pw-rule" data-rule="upper"><span class="ri"></span><span data-i18n="ruleUpper">حرف كبير واحد على الأقل</span></span>
          <span class="pw-rule" data-rule="lower"><span class="ri"></span><span data-i18n="ruleLower">حرف صغير واحد على الأقل</span></span>
          <span class="pw-rule" data-rule="digit"><span class="ri"></span><span data-i18n="ruleDigit">رقم واحد على الأقل</span></span>
        </div>
        <p class="err-msg" id="passErr"></p>
      </div>

      <div class="field">
        <label class="label" for="confirm" data-i18n="confirmL">تأكيد كلمة المرور</label>
        <div class="input-group">
          <input class="input" type="password" id="confirm" autocomplete="new-password"
                 data-i18n-ph="passPh" placeholder="••••••••">
          <button class="in-btn" type="button" data-eye="confirm" aria-label="إظهار كلمة المرور"></button>
        </div>
        <p class="err-msg" id="confirmErr"></p>
      </div>

      <button class="btn btn-primary btn-lg btn-block" type="submit" id="submitBtn" data-i18n="saveBtn">تعيين كلمة المرور</button>
    </form>

    <p class="auth-foot">
      <a href="forgot.html" data-i18n="resend">لم يصلك الكود؟ أرسله مرة أخرى</a>
    </p>
  </section>

  <!-- success -->
  <section class="auth-card anim-in" id="doneBox" hidden>
    <div class="stack g3" style="text-align:center;align-items:center">
      <span class="success-art" id="okArt"></span>
      <h1 style="font-size:26px;font-weight:900" data-i18n="okTitle">تم تغيير كلمة المرور</h1>
      <p class="muted" data-i18n="okSub">تقدر تسجّل دخولك دلوقتي بكلمة المرور الجديدة</p>
      <a class="btn btn-primary btn-lg btn-block" href="login.html" data-i18n="okBtn">تسجيل الدخول</a>
    </div>
  </section>
</main>

<script src="assets/liqaa-ui.js"></script>
<script>
(function () {
  var CODE_TTL = 10 * 60 * 1000;

  var DICT = {
    ar: {
      docTitle: "إعادة تعيين كلمة المرور — لقاء",
      brand: "لقاء",
      title: "كلمة مرور جديدة",
      sub: "أدخل الكود المرسل إلى بريدك ثم اختر كلمة مرور جديدة",
      emailLabel: "البريد الإلكتروني", emailPh: "example@mail.com",
      codeLabel: "كود إعادة التعيين",
      passLabel: "كلمة المرور الجديدة", passPh: "••••••••",
      confirmL: "تأكيد كلمة المرور",
      ruleLen: "٨ أحرف على الأقل", ruleUpper: "حرف كبير واحد على الأقل",
      ruleLower: "حرف صغير واحد على الأقل", ruleDigit: "رقم واحد على الأقل",
      saveBtn: "تعيين كلمة المرور", savingBtn: "جارٍ الحفظ…",
      resend: "لم يصلك الكود؟ أرسله مرة أخرى",
      okTitle: "تم تغيير كلمة المرور",
      okSub: "تقدر تسجّل دخولك دلوقتي بكلمة المرور الجديدة",
      okBtn: "تسجيل الدخول",
      errEmailInvalid: "اكتب بريدًا إلكترونيًا صحيحًا",
      errNotRegistered: "هذا البريد غير مسجّل",
      errNeedCode: 'اطلب كود إعادة التعيين أولًا من <a href="forgot.html">هنا</a>',
      errIncomplete: "أدخل الأرقام الستة كاملة",
      errWrongCode: "الكود غير صحيح — حاول مرة أخرى",
      errExpired: 'انتهت صلاحية الكود — <a href="forgot.html">اطلب كودًا جديدًا</a>',
      errPassword: "كلمة المرور لازم تحقق كل الشروط",
      errMismatch: "كلمتا المرور غير متطابقتين",
      themeTitle: "تبديل المظهر",
      showPass: "إظهار كلمة المرور", hidePass: "إخفاء كلمة المرور"
    },
    en: {
      docTitle: "Reset password — Liqaa",
      brand: "Liqaa",
      title: "Set a new password",
      sub: "Enter the code we emailed you, then choose a new password",
      emailLabel: "Email", emailPh: "example@mail.com",
      codeLabel: "Reset code",
      passLabel: "New password", passPh: "••••••••",
      confirmL: "Confirm password",
      ruleLen: "At least 8 characters", ruleUpper: "At least one uppercase letter",
      ruleLower: "At least one lowercase letter", ruleDigit: "At least one number",
      saveBtn: "Set new password", savingBtn: "Saving…",
      resend: "Didn't get the code? Send it again",
      okTitle: "Password updated",
      okSub: "You can now sign in with your new password",
      okBtn: "Sign in",
      errEmailInvalid: "Enter a valid email address",
      errNotRegistered: "This email is not registered",
      errNeedCode: 'Request a reset code <a href="forgot.html">here</a> first',
      errIncomplete: "Enter all six digits",
      errWrongCode: "Incorrect code — please try again",
      errExpired: 'Code expired — <a href="forgot.html">request a new one</a>',
      errPassword: "Your password must meet all the rules",
      errMismatch: "Passwords don't match",
      themeTitle: "Toggle theme",
      showPass: "Show password", hidePass: "Hide password"
    }
  };

  Liqaa.boot({ dict: DICT });
  document.getElementById('brandMark').innerHTML = Liqaa.icon('logo');
  document.getElementById('okArt').innerHTML = Liqaa.icon('checkCircle');
  document.getElementById('themeToggle').addEventListener('click', Liqaa.toggleTheme);
  document.getElementById('langToggle').addEventListener('click', Liqaa.toggleLang);

  var email = document.getElementById('email');
  var pw = document.getElementById('password');
  var cf = document.getElementById('confirm');
  var otpBox = document.getElementById('otpBox');
  var otps = Array.prototype.slice.call(otpBox.querySelectorAll('input'));
  var submitBtn = document.getElementById('submitBtn');
  var E = {
    email: document.getElementById('emailErr'),
    code: document.getElementById('codeErr'),
    pw: document.getElementById('passErr'),
    cf: document.getElementById('confirmErr')
  };

  document.querySelectorAll('[data-eye]').forEach(function (btn) {
    var input = document.getElementById(btn.getAttribute('data-eye'));
    function paint() {
      var showing = input.type === 'text';
      btn.innerHTML = Liqaa.icon(showing ? 'eyeOff' : 'eye');
      btn.setAttribute('aria-label', Liqaa.t(showing ? 'hidePass' : 'showPass'));
    }
    paint();
    btn.addEventListener('click', function () {
      input.type = input.type === 'password' ? 'text' : 'password'; paint();
    });
    document.addEventListener('liqaa:lang', paint);
  });

  function otpValue() { return otps.map(function (i) { return i.value; }).join(''); }
  function paintOtp() { otps.forEach(function (i) { i.classList.toggle('filled', !!i.value); }); }
  otps.forEach(function (inp, idx) {
    inp.addEventListener('input', function () {
      inp.value = inp.value.replace(/\D/g, '').slice(0, 1);
      paintOtp();
      E.code.classList.remove('show');
      if (inp.value && idx < otps.length - 1) otps[idx + 1].focus();
    });
    inp.addEventListener('keydown', function (e) {
      if (e.key === 'Backspace' && !inp.value && idx > 0) {
        e.preventDefault(); otps[idx - 1].value = ''; otps[idx - 1].focus(); paintOtp();
      } else if (e.key === 'ArrowLeft' && idx > 0) { e.preventDefault(); otps[idx - 1].focus(); }
      else if (e.key === 'ArrowRight' && idx < otps.length - 1) { e.preventDefault(); otps[idx + 1].focus(); }
    });
    inp.addEventListener('paste', function (e) {
      e.preventDefault();
      var digits = ((e.clipboardData || window.clipboardData).getData('text') || '').replace(/\D/g, '').slice(0, 6).split('');
      if (!digits.length) return;
      digits.forEach(function (d, i) { if (otps[i]) otps[i].value = d; });
      paintOtp();
      otps[Math.min(digits.length, otps.length - 1)].focus();
    });
    inp.addEventListener('focus', function () { inp.select(); });
  });

  function pwChecks(v) {
    return { len: v.length >= 8, upper: /[A-Z]/.test(v), lower: /[a-z]/.test(v), digit: /[0-9]/.test(v) };
  }
  function updatePw() {
    var c = pwChecks(pw.value);
    var score = ['len', 'upper', 'lower', 'digit'].filter(function (k) { return c[k]; }).length;
    document.getElementById('pwMeter').className = 'pw-meter' + (pw.value ? ' s' + score : '');
    document.querySelectorAll('.pw-rule').forEach(function (r) {
      var ok = c[r.getAttribute('data-rule')];
      r.classList.toggle('ok', !!ok);
      r.querySelector('.ri').innerHTML = Liqaa.icon(ok ? 'check' : 'info');
    });
  }
  pw.addEventListener('input', updatePw);
  updatePw();
  document.addEventListener('liqaa:lang', updatePw);

  function showErr(box, input, html) {
    box.innerHTML = Liqaa.icon('alert') + '<span>' + html + '</span>';
    box.classList.add('show');
    if (input) input.classList.add('err');
  }
  function clearErrs() {
    Object.keys(E).forEach(function (k) { E[k].classList.remove('show'); });
    [email, pw, cf].forEach(function (i) { i.classList.remove('err'); });
  }
  [email, pw, cf].forEach(function (i) {
    i.addEventListener('input', function () { i.classList.remove('err'); });
  });

  document.getElementById('resetForm').addEventListener('submit', function (e) {
    e.preventDefault();
    if (submitBtn.disabled) return;
    clearErrs();

    var em = email.value.trim(), e2 = em.toLowerCase();
    if (!em || !email.checkValidity()) { showErr(E.email, email, Liqaa.t('errEmailInvalid')); email.focus(); return; }

    var users = Liqaa.users(), rec = null;
    users.forEach(function (u) { if (u.email && u.email.toLowerCase() === e2) rec = u; });
    if (!rec) { showErr(E.email, email, Liqaa.t('errNotRegistered')); return; }

    var code = otpValue();
    if (code.length !== 6) { showErr(E.code, null, Liqaa.t('errIncomplete')); otpBox.classList.add('err'); setTimeout(function(){otpBox.classList.remove('err');},500); return; }

    var saved = Liqaa.LS.get('liqaa_reset_' + e2, null);
    if (!saved) { showErr(E.code, null, Liqaa.t('errNeedCode')); return; }
    if (Date.now() - saved.at > CODE_TTL) { showErr(E.code, null, Liqaa.t('errExpired')); return; }
    if (code !== saved.code) {
      showErr(E.code, null, Liqaa.t('errWrongCode'));
      otpBox.classList.add('err');
      setTimeout(function () { otpBox.classList.remove('err'); }, 500);
      otps.forEach(function (i) { i.value = ''; });
      paintOtp(); otps[0].focus();
      return;
    }

    var c = pwChecks(pw.value);
    if (!c.len || !c.upper || !c.lower || !c.digit) { showErr(E.pw, pw, Liqaa.t('errPassword')); pw.focus(); return; }
    if (pw.value !== cf.value) { showErr(E.cf, cf, Liqaa.t('errMismatch')); cf.focus(); return; }

    Liqaa.setLoading(submitBtn, true, Liqaa.t('savingBtn'));
    setTimeout(function () {
      users.forEach(function (u) {
        if (u.email && u.email.toLowerCase() === e2) { u.password = pw.value; u.verified = true; }
      });
      Liqaa.LS.set('liqaa_users', users);
      try { localStorage.removeItem('liqaa_reset_' + e2); } catch (err) {}
      document.getElementById('resetMain').hidden = true;
      document.getElementById('resetMain').style.display = 'none';
      document.getElementById('doneBox').hidden = false;
    }, 650);
  });

  try {
    var pre = new URLSearchParams(location.search).get('email');
    if (pre) { email.value = pre; otps[0].focus(); } else { email.focus(); }
  } catch (e) {}
})();
</script>
</body>
</html>
