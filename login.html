<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تسجيل الدخول — لقاء</title>
<meta name="description" content="سجّل دخولك إلى لقاء بحساب Google.">
<link rel="icon" href="liqaa-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/liqaa-ui.css">
<style>
  /* Google-only sign-in uses a wide, landing-page-scale composition. */
  .google-auth-page .auth-wrap { padding: 112px clamp(22px, 5vw, 72px) 38px; }
  /* Keep the brand, language and theme controls at the top edge like the landing header. */
  .google-auth-page .auth-top {
    position: absolute;
    top: 18px;
    inset-inline: clamp(22px, 5vw, 72px);
    width: auto;
    max-width: none;
    margin: 0;
  }
  .google-auth-page .auth-card {
    max-width: 980px;
    min-height: 410px;
    padding: clamp(48px, 7vw, 82px) clamp(28px, 9vw, 128px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .google-auth-page .auth-head { margin-bottom: 34px; }
  .google-auth-page .auth-head h1 { font-size: clamp(30px, 4vw, 42px); margin-bottom: 12px; }
  .google-auth-page .auth-head p { font-size: 17px; }
  .google-auth-page #googleBtn { width: min(100%, 520px); min-height: 62px; font-size: 18px; border-radius: 16px; }
  .google-auth-page #googleBtn svg { width: 23px; height: 23px; }
  @media (max-width: 640px) {
    .google-auth-page .auth-wrap { padding: 96px 16px 28px; }
    .google-auth-page .auth-top { top: 14px; inset-inline: 16px; }
    .google-auth-page .auth-card { min-height: 340px; padding: 44px 22px; }
    .google-auth-page .auth-head h1 { font-size: 30px; }
  }
</style>
<script>(function(){try{var t=localStorage.getItem('lm-theme');if(t&&t.indexOf('light')>-1)document.documentElement.classList.add('light');var l=localStorage.getItem('lm-lang');var en=l&&l.indexOf('en')>-1;document.documentElement.lang=en?'en':'ar';document.documentElement.dir=en?'ltr':'rtl';}catch(e){}})();</script>
</head>
<body class="google-auth-page">
<main class="auth-wrap" id="main">
  <div class="auth-top">
    <a class="brand" href="index.html"><span class="brand-mark" id="brandMark"></span><span data-i18n="brand">لقاء</span></a>
    <div class="row">
      <button class="lang-btn" id="langToggle" type="button">EN</button>
      <button class="switch" id="themeToggle" type="button" data-i18n-title="themeTitle" title="تبديل المظهر"><span class="knob"><svg class="ic ic-moon" viewBox="0 0 24 24" fill="#fff"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="ic ic-sun" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span></button>
    </div>
  </div>
  <section class="auth-card anim-in">
    <div class="auth-head"><h1 data-i18n="title">أهلًا بك في لقاء</h1><p data-i18n="sub">تابع باستخدام حساب Google للبدء</p></div>
    <button class="btn btn-secondary btn-block" type="button" id="googleBtn"><span id="gIcon"></span><span data-i18n="google">المتابعة بحساب Google</span></button>
  </section>
  <p class="auth-foot"><a href="index.html" data-i18n="back">العودة إلى الصفحة الرئيسية</a></p>
</main>
<script src="assets/liqaa-ui.js"></script>
<script>
(function(){
 var DICT={ar:{docTitle:'تسجيل الدخول — لقاء',brand:'لقاء',title:'أهلًا بك في لقاء',sub:'تابع باستخدام حساب Google للبدء',google:'المتابعة بحساب Google',back:'العودة إلى الصفحة الرئيسية',themeTitle:'تبديل المظهر',ok:'تم تسجيل الدخول بنجاح',error:'تعذر تسجيل الدخول بحساب Google. تأكد من تفعيل Google وإضافة نطاق الموقع في Firebase.'},en:{docTitle:'Sign in — Liqaa',brand:'Liqaa',title:'Welcome to Liqaa',sub:'Continue with Google to get started',google:'Continue with Google',back:'Back to home',themeTitle:'Toggle theme',ok:'Signed in successfully',error:'Google sign-in failed. Enable Google and add this site domain in Firebase.'}};
 Liqaa.boot({dict:DICT});
 document.getElementById('brandMark').innerHTML=Liqaa.icon('logo');
 document.getElementById('gIcon').innerHTML=Liqaa.icon('google');
 document.getElementById('themeToggle').addEventListener('click',Liqaa.toggleTheme);
 document.getElementById('langToggle').addEventListener('click',Liqaa.toggleLang);
 var s=Liqaa.session(); if(s&&s.email){location.replace('dashboard.html');return;}
 document.getElementById('googleBtn').addEventListener('click',function(){ location.href='/api/auth/google'; });
})();
</script>
</body>
</html>
