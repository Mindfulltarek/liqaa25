<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تأكيد البريد الإلكتروني — لقاء</title>
<meta name="description" content="أكّد بريدك الإلكتروني لتفعيل حسابك في لقاء.">
<link rel="icon" href="liqaa-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/liqaa-ui.css">
<script>(function(){try{var t=localStorage.getItem('lm-theme');if(t&&t.indexOf('light')>-1)document.documentElement.classList.add('light');var l=localStorage.getItem('lm-lang');var en=l&&l.indexOf('en')>-1;document.documentElement.lang=en?'en':'ar';document.documentElement.dir=en?'ltr':'rtl';}catch(e){}})();</script>
<style>
  .sent-note { display: none; align-items: flex-start; gap: 9px; padding: 12px 14px; border-radius: var(--r-md);
    background: var(--tint); border: 1px solid var(--tint-line); color: var(--text); font-size: 14px; line-height: 1.6; }
  .sent-note.show { display: flex; animation: fadeUp var(--t-mid) var(--ease); }
  .sent-note svg { width: 18px; height: 18px; color: var(--c1); flex: none; margin-top: 2px; }
  .sent-note b { word-break: break-all; }
  .resend-row { display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
  .resend-row button { background: none; border: 0; color: var(--c1); font: inherit; font-weight: 800; cursor: pointer; padding: 4px 6px; border-radius: 8px; }
  .resend-row button:disabled { color: var(--faint); cursor: not-allowed; font-weight: 700; }
  .resend-row button:not(:disabled):hover { background: var(--tint); }
</style>
</head>
<body>
<main class="auth-wrap" id="main">
  <div class="auth-top">
    <a class="brand" href="index.html"><span class="brand-mark" id="brandMark"></span><span data-i18n="brand">لقاء</span></a>
    <div class="row">
      <button class="lang-btn" id="langToggle" type="button">EN</button>
      <button class="switch" id="themeToggle" type="button" data-i18n-title="themeTitle" title="تبديل المظهر">
        <span class="knob">
          <svg class="ic ic-moon" viewBox="0 0 24 24" fill="#fff"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="ic ic-sun" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </span>
      </button>
    </div>
  </div>

  <!-- ===== Verify step ===== -->
  <section class="auth-card anim-in" id="verifyMain">
    <div class="auth-head">
      <h1 data-i18n="vTitle">تأكيد البريد الإلكتروني</h1>
      <p data-i18n="vSub">أدخل الكود المكوّن من 6 أرقام الذي أرسلناه إلى بريدك</p>
    </div>

    <div class="stack g3">
      <div class="field">
        <label class="label" for="vEmail" data-i18n="vEmailL">البريد الإلكتروني</label>
        <input class="input" type="email" id="vEmail" autocomplete="email"
               data-i18n-ph="emailPh" placeholder="example@mail.com">
        <p class="err-msg" id="vEmailErr"></p>
      </div>

      <button class="btn btn-secondary btn-block" type="button" id="sendBtn" data-i18n="sendBtn">إرسال الكود</button>

      <p class="sent-note" id="sentMsg"></p>

      <form id="verifyForm" class="stack g3" novalidate>
        <div class="field">
          <span class="label" data-i18n="vCodeL">كود التأكيد</span>
          <div class="otp" id="otpBox" dir="ltr">
            <input type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="1">
            <input type="text" inputmode="numeric" maxlength="1" aria-label="2">
            <input type="text" inputmode="numeric" maxlength="1" aria-label="3">
            <input type="text" inputmode="numeric" maxlength="1" aria-label="4">
            <input type="text" inputmode="numeric" maxlength="1" aria-label="5">
            <input type="text" inputmode="numeric" maxlength="1" aria-label="6">
          </div>
          <p class="err-msg" id="vCodeErr"></p>
        </div>

        <button class="btn btn-primary btn-lg btn-block" type="submit" id="verifyBtn" data-i18n="verifyBtn">تأكيد البريد الإلكتروني</button>
      </form>

      <div class="resend-row">
        <span data-i18n="noCode">لم يصلك الكود؟</span>
        <button type="button" id="resendBtn" data-i18n="resend">إعادة الإرسال</button>
      </div>
    </div>

    <p class="auth-foot"><a href="login.html" data-i18n="backLogin">العودة لتسجيل الدخول</a></p>
  </section>

  <!-- ===== Success step ===== -->
  <section class="auth-card anim-in" id="verifiedBox" hidden>
    <div class="stack g3" style="text-align:center;align-items:center">
      <span class="success-art" id="okArt"></span>
      <h1 style="font-size:26px;font-weight:900" data-i18n="vOkTitle">تم تأكيد بريدك الإلكتروني!</h1>
      <p class="muted" data-i18n="vOkSub">حسابك جاهز — يلا نبدأ أول اجتماع</p>
      <a class="btn btn-primary btn-lg btn-block" href="dashboard.html" data-i18n="vOkBtn">الذهاب إلى لوحة التحكم</a>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="assets/liqaa-ui.js"></script>
<script>
(function () {
  // ====== EmailJS config — preserved exactly from v4 ======
  var EMAILJS_CFG = {
    serviceId: 'service_fib2yw7',
    templateId: 'template_eznthic',
    publicKey: 'aG28fwHcrcOAbrsbm'
  };
  var CODE_TTL = 10 * 60 * 1000;   // 10 minutes
  var RESEND_LIMIT = 60;           // seconds

  var DICT = {
    ar: {
      docTitle: "تأكيد البريد الإلكتروني — لقاء",
      brand: "لقاء",
      vTitle: "تأكيد البريد الإلكتروني",
      vSub: "أدخل الكود المكوّن من 6 أرقام الذي أرسلناه إلى بريدك",
      vEmailL: "البريد الإلكتروني", emailPh: "example@mail.com",
      vCodeL: "كود التأكيد",
      sendBtn: "إرسال الكود", sendingBtn: "جارٍ الإرسال…",
      verifyBtn: "تأكيد البريد الإلكتروني", verifyingBtn: "جارٍ التأكيد…",
      noCode: "لم يصلك الكود؟", resend: "إعادة الإرسال",
      resendIn: "إعادة الإرسال بعد {s} ثانية",
      backLogin: "العودة لتسجيل الدخول",
      vOkTitle: "تم تأكيد بريدك الإلكتروني!",
      vOkSub: "حسابك جاهز — يلا نبدأ أول اجتماع",
      vOkBtn: "الذهاب إلى لوحة التحكم",
      errEmailInvalid: "اكتب بريدًا إلكترونيًا صحيحًا",
      errNotRegistered: 'هذا البريد غير مسجّل — <a href="signup.html">أنشئ حسابًا</a> أولًا',
      errAlreadyVerified: 'هذا البريد مؤكَّد بالفعل — <a href="login.html">سجّل دخولك</a>',
      errNeedCode: "اطلب الكود أولًا من زر «إرسال الكود»",
      errIncomplete: "أدخل الأرقام الستة كاملة",
      errWrongCode: "الكود غير صحيح — تأكد وحاول مرة أخرى",
      errCodeExpired: "انتهت صلاحية الكود — اطلب كودًا جديدًا",
      errSendFail: "فشل إرسال البريد — حاول مرة أخرى",
      sentMsg: 'أرسلنا كود تأكيد من 6 أرقام إلى <b>{{email}}</b>',
      okSent: "تم إرسال الكود إلى بريدك",
      themeTitle: "تبديل المظهر"
    },
    en: {
      docTitle: "Verify email — Liqaa",
      brand: "Liqaa",
      vTitle: "Verify your email",
      vSub: "Enter the 6-digit code we sent to your inbox",
      vEmailL: "Email address", emailPh: "example@mail.com",
      vCodeL: "Verification code",
      sendBtn: "Send code", sendingBtn: "Sending…",
      verifyBtn: "Verify email", verifyingBtn: "Verifying…",
      noCode: "Didn't get the code?", resend: "Resend",
      resendIn: "Resend in {s}s",
      backLogin: "Back to sign in",
      vOkTitle: "Your email is verified!",
      vOkSub: "Your account is ready — let's start your first meeting",
      vOkBtn: "Go to dashboard",
      errEmailInvalid: "Enter a valid email address",
      errNotRegistered: 'This email is not registered — <a href="signup.html">create an account</a> first',
      errAlreadyVerified: 'This email is already verified — <a href="login.html">sign in</a>',
      errNeedCode: 'Request a code first using "Send code"',
      errIncomplete: "Enter all six digits",
      errWrongCode: "Incorrect code — please check and try again",
      errCodeExpired: "Code expired — request a new one",
      errSendFail: "Failed to send the email — please try again",
      sentMsg: "We've sent a 6-digit verification code to <b>{{email}}</b>",
      okSent: "Code sent to your inbox",
      themeTitle: "Toggle theme"
    }
  };

  Liqaa.boot({ dict: DICT });
  document.getElementById('brandMark').innerHTML = Liqaa.icon('logo');
  document.getElementById('okArt').innerHTML = Liqaa.icon('checkCircle');
  document.getElementById('themeToggle').addEventListener('click', Liqaa.toggleTheme);
  document.getElementById('langToggle').addEventListener('click', Liqaa.toggleLang);

  var vEmail = document.getElementById('vEmail');
  var vEmailErr = document.getElementById('vEmailErr');
  var vCodeErr = document.getElementById('vCodeErr');
  var sendBtn = document.getElementById('sendBtn');
  var resendBtn = document.getElementById('resendBtn');
  var verifyBtn = document.getElementById('verifyBtn');
  var sentMsg = document.getElementById('sentMsg');
  var otpBox = document.getElementById('otpBox');
  var otps = Array.prototype.slice.call(otpBox.querySelectorAll('input'));
  var countdown = null, secsLeft = 0;

  /* ---------- OTP behaviour: autofocus advance, paste, backspace ---------- */
  function otpValue() { return otps.map(function (i) { return i.value; }).join(''); }
  function paintOtp() {
    otps.forEach(function (i) { i.classList.toggle('filled', !!i.value); });
  }
  function clearOtp() {
    otps.forEach(function (i) { i.value = ''; });
    paintOtp();
    otps[0].focus();
  }
  otps.forEach(function (inp, idx) {
    inp.addEventListener('input', function () {
      inp.value = inp.value.replace(/\D/g, '').slice(0, 1);
      paintOtp();
      hideCodeErr();
      if (inp.value && idx < otps.length - 1) otps[idx + 1].focus();
      if (otpValue().length === 6) setTimeout(submitCode, 90); // auto-submit when complete
    });
    inp.addEventListener('keydown', function (e) {
      if (e.key === 'Backspace' && !inp.value && idx > 0) {
        e.preventDefault();
        otps[idx - 1].value = '';
        otps[idx - 1].focus();
        paintOtp();
      } else if (e.key === 'ArrowLeft' && idx > 0) { e.preventDefault(); otps[idx - 1].focus(); }
      else if (e.key === 'ArrowRight' && idx < otps.length - 1) { e.preventDefault(); otps[idx + 1].focus(); }
    });
    inp.addEventListener('paste', function (e) {
      e.preventDefault();
      var txt = (e.clipboardData || window.clipboardData).getData('text') || '';
      var digits = txt.replace(/\D/g, '').slice(0, 6).split('');
      if (!digits.length) return;
      digits.forEach(function (d, i) { if (otps[i]) otps[i].value = d; });
      paintOtp();
      hideCodeErr();
      var next = Math.min(digits.length, otps.length - 1);
      otps[next].focus();
      if (otpValue().length === 6) setTimeout(submitCode, 90);
    });
    inp.addEventListener('focus', function () { inp.select(); });
  });

  function showEmailErr(html) {
    vEmailErr.innerHTML = Liqaa.icon('alert') + '<span>' + html + '</span>';
    vEmailErr.classList.add('show');
    vEmail.classList.add('err');
  }
  function hideEmailErr() { vEmailErr.classList.remove('show'); vEmail.classList.remove('err'); }
  function showCodeErr(msg) {
    vCodeErr.innerHTML = Liqaa.icon('alert') + '<span>' + msg + '</span>';
    vCodeErr.classList.add('show');
    otpBox.classList.add('err');
    setTimeout(function () { otpBox.classList.remove('err'); }, 500);
  }
  function hideCodeErr() { vCodeErr.classList.remove('show'); }
  vEmail.addEventListener('input', hideEmailErr);

  function findUser(email) {
    var e = (email || '').toLowerCase(), found = null;
    Liqaa.users().forEach(function (u) { if (u.email && u.email.toLowerCase() === e) found = u; });
    return found;
  }
  function isConfigured() {
    return EMAILJS_CFG.serviceId && EMAILJS_CFG.templateId && EMAILJS_CFG.publicKey;
  }

  /* ---------- resend countdown ---------- */
  function startTimer(fromSecs) {
    secsLeft = (typeof fromSecs === 'number' && fromSecs > 0) ? fromSecs : RESEND_LIMIT;
    if (countdown) clearInterval(countdown);
    paintTimer();
    countdown = setInterval(function () {
      secsLeft--;
      if (secsLeft <= 0) { clearInterval(countdown); countdown = null; }
      paintTimer();
    }, 1000);
  }
  function paintTimer() {
    var running = secsLeft > 0;
    sendBtn.disabled = running;
    resendBtn.disabled = running;
    resendBtn.textContent = running ? Liqaa.t('resendIn', { s: secsLeft }) : Liqaa.t('resend');
    if (!running && !sendBtn.classList.contains('is-loading')) sendBtn.textContent = Liqaa.t('sendBtn');
  }
  document.addEventListener('liqaa:lang', paintTimer);

  /* ---------- send / resend ---------- */
  function sendCode(btn) {
    hideEmailErr(); hideCodeErr();
    var email = vEmail.value.trim();

    if (!email || !vEmail.checkValidity()) { showEmailErr(Liqaa.t('errEmailInvalid')); vEmail.focus(); return; }
    var rec = findUser(email);
    if (!rec) { showEmailErr(Liqaa.t('errNotRegistered')); return; }
    if (rec.verified) { showEmailErr(Liqaa.t('errAlreadyVerified')); return; }
    if (!isConfigured() || typeof emailjs === 'undefined') {
      Liqaa.toast(Liqaa.t('errSendFail'), 'error');
      return;
    }

    var code = String(Math.floor(100000 + Math.random() * 900000));
    Liqaa.LS.set('liqaa_code_' + email.toLowerCase(), { code: code, at: Date.now() });

    Liqaa.setLoading(btn, true, Liqaa.t('sendingBtn'));
    resendBtn.disabled = true;

    emailjs.send(EMAILJS_CFG.serviceId, EMAILJS_CFG.templateId,
      { to_email: email, email: email, VERIFICATION_CODE: code, passcode: code },
      { publicKey: EMAILJS_CFG.publicKey }
    ).then(function () {
      Liqaa.setLoading(btn, false);
      sentMsg.innerHTML = Liqaa.icon('mail') + '<span>' +
        Liqaa.t('sentMsg').replace('{{email}}', Liqaa.escapeHtml(email)) + '</span>';
      sentMsg.classList.add('show');
      Liqaa.toast(Liqaa.t('okSent'), 'ok');
      startTimer();
      otps[0].focus();
    }).catch(function (err) {
      Liqaa.setLoading(btn, false);
      var detail = '';
      try {
        detail = (err && err.text) ? err.text : (err && err.message) ? err.message
               : (err && err.status) ? ('HTTP ' + err.status) : '';
      } catch (e2) {}
      showCodeErr(Liqaa.t('errSendFail') + (detail ? ' — ' + Liqaa.escapeHtml(detail) : ''));
      console.error('EmailJS error:', err);
      resendBtn.disabled = false;
      sendBtn.disabled = false;
    });
  }
  sendBtn.addEventListener('click', function () { sendCode(sendBtn); });
  resendBtn.addEventListener('click', function () { if (!resendBtn.disabled) sendCode(sendBtn); });

  /* ---------- verify ---------- */
  function submitCode() {
    if (verifyBtn.disabled) return;
    hideEmailErr(); hideCodeErr();

    var email = vEmail.value.trim();
    if (!email || !vEmail.checkValidity()) { showEmailErr(Liqaa.t('errEmailInvalid')); vEmail.focus(); return; }
    var rec = findUser(email);
    if (!rec) { showEmailErr(Liqaa.t('errNotRegistered')); return; }
    if (rec.verified) { showEmailErr(Liqaa.t('errAlreadyVerified')); return; }

    var code = otpValue();
    if (code.length !== 6) { showCodeErr(Liqaa.t('errIncomplete')); otps[Math.max(0, code.length)].focus(); return; }

    var saved = Liqaa.LS.get('liqaa_code_' + email.toLowerCase(), null);
    if (!saved) { showCodeErr(Liqaa.t('errNeedCode')); return; }
    if (Date.now() - saved.at > CODE_TTL) { showCodeErr(Liqaa.t('errCodeExpired')); clearOtp(); return; }

    Liqaa.setLoading(verifyBtn, true, Liqaa.t('verifyingBtn'));

    setTimeout(function () {
      if (code !== saved.code) {
        Liqaa.setLoading(verifyBtn, false);
        showCodeErr(Liqaa.t('errWrongCode'));
        clearOtp();
        return;
      }
      // Firebase owns the account; retain the existing verification-screen behavior locally.
      var users = Liqaa.users();
      users.forEach(function (u) {
        if (u.email && u.email.toLowerCase() === email.toLowerCase()) u.verified = true;
      });
      Liqaa.LS.set('liqaa_users', users);
      Liqaa.LS.set('liqaa_session', {
        email: email,
        firstName: (rec && rec.firstName) || '',
        lastName: (rec && rec.lastName) || '',
        username: (rec && rec.username) || ''
      });
      try { localStorage.removeItem('liqaa_code_' + email.toLowerCase()); } catch (e) {}
      document.getElementById('verifyMain').hidden = true;
      document.getElementById('verifyMain').style.display = 'none';
      document.getElementById('verifiedBox').hidden = false;
      if (countdown) clearInterval(countdown);
      setTimeout(function () { location.href = 'dashboard.html'; }, 1500);
    }, 650);
  }
  document.getElementById('verifyForm').addEventListener('submit', function (e) {
    e.preventDefault();
    submitCode();
  });

  // prefill from ?email=
  var pre = null;
  try {
    pre = new URLSearchParams(location.search).get('email');
    if (pre) { vEmail.value = pre; otps[0].focus(); }
  } catch (e) {}
  paintTimer();

  /* ---------- first code is sent automatically (spec #4) ----------
     The user must never have to press "Resend" to get the first email.
     Guards, so a reload or a returning user does not re-send:
       - only with ?email= in the URL
       - only if that account exists and is not yet verified
       - only if no unexpired code was already issued for this address
     sendCode() itself surfaces a real error if EmailJS is unreachable;
     we never show a fake "sent" state. */
  (function autoSendFirstCode() {
    if (!pre) return;
    var email = pre.trim();
    if (!email) return;
    var rec = findUser(email);
    if (!rec || rec.verified) return;

    var existing = Liqaa.LS.get('liqaa_code_' + email.toLowerCase(), null);
    if (existing && existing.at && (Date.now() - existing.at) < RESEND_LIMIT * 1000) {
      // a code went out moments ago (e.g. page refresh) — just resume the countdown
      secsLeft = Math.max(1, RESEND_LIMIT - Math.floor((Date.now() - existing.at) / 1000));
      startTimer(secsLeft);
      sentMsg.innerHTML = Liqaa.icon('mail') + '<span>' +
        Liqaa.t('sentMsg').replace('{{email}}', Liqaa.escapeHtml(email)) + '</span>';
      sentMsg.classList.add('show');
      return;
    }
    sendCode(sendBtn);
  })();
})();
</script>
</body>
</html>
