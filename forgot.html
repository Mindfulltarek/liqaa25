<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نسيت كلمة المرور — لقاء</title>
<meta name="description" content="استعد الوصول إلى حسابك في لقاء.">
<link rel="icon" href="liqaa-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/liqaa-ui.css">
<script>(function(){try{var t=localStorage.getItem('lm-theme');if(t&&t.indexOf('light')>-1)document.documentElement.classList.add('light');var l=localStorage.getItem('lm-lang');var en=l&&l.indexOf('en')>-1;document.documentElement.lang=en?'en':'ar';document.documentElement.dir=en?'ltr':'rtl';}catch(e){}})();</script>
<style>
  .sent-note { display: none; align-items: flex-start; gap: 9px; padding: 12px 14px; border-radius: var(--r-md);
    background: var(--tint); border: 1px solid var(--tint-line); font-size: 14px; line-height: 1.6; }
  .sent-note.show { display: flex; animation: fadeUp var(--t-mid) var(--ease); }
  .sent-note svg { width: 18px; height: 18px; color: var(--c1); flex: none; margin-top: 2px; }
  .sent-note b { word-break: break-all; }
</style>
</head>
<body>
<main class="auth-wrap" id="main">
  <div class="auth-top">
    <a class="brand" href="index.html"><span class="brand-mark" id="brandMark"></span><span data-i18n="brand">لقاء</span></a>
    <div class="row">
      <button class="lang-btn" id="langToggle" type="button">EN</button>
      <button class="switch" id="themeToggle" type="button" data-i18n-title="themeTitle" title="تبديل المظهر">
        <span class="knob">
          <svg class="ic ic-moon" viewBox="0 0 24 24" fill="#fff"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="ic ic-sun" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </span>
      </button>
    </div>
  </div>

  <section class="auth-card anim-in">
    <div class="auth-head">
      <span class="success-art" id="keyArt" style="margin-inline:auto 0"></span>
      <h1 data-i18n="title">نسيت كلمة المرور؟</h1>
      <p data-i18n="sub">اكتب بريدك الإلكتروني وهنبعتلك كود لإعادة التعيين</p>
    </div>

    <form id="forgotForm" class="stack g3" novalidate>
      <div class="field">
        <label class="label" for="email" data-i18n="emailLabel">البريد الإلكتروني</label>
        <input class="input" type="email" id="email" autocomplete="email"
               data-i18n-ph="emailPh" placeholder="example@mail.com" data-autofocus>
        <p class="err-msg" id="emailErr"></p>
      </div>

      <p class="sent-note" id="sentMsg"></p>

      <button class="btn btn-primary btn-lg btn-block" type="submit" id="submitBtn" data-i18n="sendBtn">إرسال كود إعادة التعيين</button>
    </form>

    <p class="auth-foot"><a href="login.html" data-i18n="backLogin">العودة لتسجيل الدخول</a></p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="assets/liqaa-ui.js"></script>
<script>
(function () {
  // Same EmailJS account used for verification in v4
  var EMAILJS_CFG = {
    serviceId: 'service_fib2yw7',
    templateId: 'template_eznthic',
    publicKey: 'aG28fwHcrcOAbrsbm'
  };

  var DICT = {
    ar: {
      docTitle: "نسيت كلمة المرور — لقاء",
      brand: "لقاء",
      title: "نسيت كلمة المرور؟",
      sub: "اكتب بريدك الإلكتروني وهنبعتلك كود لإعادة التعيين",
      emailLabel: "البريد الإلكتروني", emailPh: "example@mail.com",
      sendBtn: "إرسال كود إعادة التعيين", sendingBtn: "جارٍ الإرسال…",
      backLogin: "العودة لتسجيل الدخول",
      errEmailInvalid: "اكتب بريدًا إلكترونيًا صحيحًا",
      errNotRegistered: 'هذا البريد غير مسجّل — <a href="signup.html">أنشئ حسابًا</a>',
      errSendFail: "فشل إرسال البريد — حاول مرة أخرى",
      sentMsg: 'أرسلنا كود إعادة التعيين إلى <b>{{email}}</b> — الكود صالح لمدة 10 دقائق.',
      okSent: "تم إرسال الكود",
      themeTitle: "تبديل المظهر"
    },
    en: {
      docTitle: "Forgot password — Liqaa",
      brand: "Liqaa",
      title: "Forgot your password?",
      sub: "Enter your email and we'll send you a reset code",
      emailLabel: "Email", emailPh: "example@mail.com",
      sendBtn: "Send reset code", sendingBtn: "Sending…",
      backLogin: "Back to sign in",
      errEmailInvalid: "Enter a valid email address",
      errNotRegistered: 'This email is not registered — <a href="signup.html">create an account</a>',
      errSendFail: "Failed to send the email — please try again",
      sentMsg: "We've sent a reset code to <b>{{email}}</b> — it's valid for 10 minutes.",
      okSent: "Reset code sent",
      themeTitle: "Toggle theme"
    }
  };

  Liqaa.boot({ dict: DICT });
  document.getElementById('brandMark').innerHTML = Liqaa.icon('logo');
  document.getElementById('keyArt').innerHTML = Liqaa.icon('key');
  document.getElementById('themeToggle').addEventListener('click', Liqaa.toggleTheme);
  document.getElementById('langToggle').addEventListener('click', Liqaa.toggleLang);

  var email = document.getElementById('email');
  var emailErr = document.getElementById('emailErr');
  var submitBtn = document.getElementById('submitBtn');
  var sentMsg = document.getElementById('sentMsg');

  function showErr(html) {
    emailErr.innerHTML = Liqaa.icon('alert') + '<span>' + html + '</span>';
    emailErr.classList.add('show');
    email.classList.add('err');
  }
  email.addEventListener('input', function () {
    emailErr.classList.remove('show'); email.classList.remove('err');
  });

  document.getElementById('forgotForm').addEventListener('submit', function (e) {
    e.preventDefault();
    if (submitBtn.disabled) return;
    emailErr.classList.remove('show'); email.classList.remove('err');

    var em = email.value.trim();
    if (!em || !email.checkValidity()) { showErr(Liqaa.t('errEmailInvalid')); email.focus(); return; }

    var rec = null, e2 = em.toLowerCase();
    Liqaa.users().forEach(function (u) { if (u.email && u.email.toLowerCase() === e2) rec = u; });
    if (!rec) { showErr(Liqaa.t('errNotRegistered')); return; }

    if (typeof emailjs === 'undefined') { Liqaa.toast(Liqaa.t('errSendFail'), 'error'); return; }

    var code = String(Math.floor(100000 + Math.random() * 900000));
    Liqaa.LS.set('liqaa_reset_' + e2, { code: code, at: Date.now() });

    Liqaa.setLoading(submitBtn, true, Liqaa.t('sendingBtn'));

    emailjs.send(EMAILJS_CFG.serviceId, EMAILJS_CFG.templateId,
      { to_email: em, email: em, VERIFICATION_CODE: code, passcode: code },
      { publicKey: EMAILJS_CFG.publicKey }
    ).then(function () {
      Liqaa.setLoading(submitBtn, false);
      sentMsg.innerHTML = Liqaa.icon('mail') + '<span>' +
        Liqaa.t('sentMsg').replace('{{email}}', Liqaa.escapeHtml(em)) + '</span>';
      sentMsg.classList.add('show');
      Liqaa.toast(Liqaa.t('okSent'), 'ok');
      setTimeout(function () {
        location.href = 'reset.html?email=' + encodeURIComponent(em);
      }, 1100);
    }).catch(function (err) {
      Liqaa.setLoading(submitBtn, false);
      var detail = (err && (err.text || err.message)) || '';
      showErr(Liqaa.t('errSendFail') + (detail ? ' — ' + Liqaa.escapeHtml(detail) : ''));
      console.error('EmailJS error:', err);
    });
  });
})();
</script>
</body>
</html>
